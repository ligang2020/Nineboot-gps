name: Build and publish IPA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Also upload the IPA to a GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'
      release_tag:
        description: 'Optional release tag; blank uses the app version (for example v1.2.49)'
        required: false
        default: ''
  push:
    branches: [main, master]
    tags: ['v*']

# Every run uploads an Actions artifact. Tag builds publish the matching GitHub
# Release automatically; manual runs can opt into publishing/updating a release.
permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA
    # 固定 macOS 15 + Xcode 16.4：该镜像包含 iOS 18 SDK，和项目的 iOS 18
    # 最低部署版本一致，避免 macos-latest 切换默认 Xcode 后产生不可复现的 IPA。
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Xcode and app version
        run: |
          set -euo pipefail
          xcodebuild -version
          test -d "$DEVELOPER_DIR"
          PROJECT=mini-ninebot.xcodeproj/project.pbxproj
          VERSION="$(awk -F ' = ' '/MARKETING_VERSION = / { gsub(/;/, "", $2); print $2; exit }' "$PROJECT")"
          BUILD="$(awk -F ' = ' '/CURRENT_PROJECT_VERSION = / { gsub(/;/, "", $2); print $2; exit }' "$PROJECT")"
          test -n "$VERSION"
          test -n "$BUILD"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "v$VERSION" = "$GITHUB_REF_NAME"
          fi
          echo "Building source version $VERSION ($BUILD) without modifying project settings."

      - name: Build and package unsigned IPA
        id: package
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/NinePlusIPA
          DERIVED_DATA: ${{ runner.temp }}/NinePlusDerivedData
        run: |
          set -euo pipefail
          IPA_PATH="$(scripts/package-unsigned-ipa.sh \
            --output "$ARTIFACT_DIR" \
            --derived-data "$DERIVED_DATA")"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$IPA_PATH.sha256" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$(basename "$IPA_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ipa_name }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F ' = ' '/MARKETING_VERSION = / { gsub(/;/, "", $2); print $2; exit }' mini-ninebot.xcodeproj/project.pbxproj)"
          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=${EXPECTED_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_release }}" == "true" ]]; then
            REQUESTED_TAG="${{ inputs.release_tag }}"
            if [[ -n "$REQUESTED_TAG" ]]; then
              test "$REQUESTED_TAG" = "$EXPECTED_TAG"
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=${EXPECTED_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload IPA to GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          files=("$IPA_PATH" "$CHECKSUM_PATH")
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --title "NinePlus LiveRide $TAG_NAME" \
              --notes "Unsigned IPA built by GitHub Actions from ${GITHUB_SHA}."
          fi
