name: Build and publish IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

# A tag build creates/updates the matching GitHub Release. Branch builds only
# upload the short-lived workflow artifact below.
permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build device app without signing
        env:
          DERIVED_DATA: ${{ runner.temp }}/NinePlusDerivedData
        run: |
          set -euo pipefail
          xcodebuild \
            -project mini-ninebot.xcodeproj \
            -scheme mini-ninebot \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify app, icon, and widget bundle
        env:
          DERIVED_DATA: ${{ runner.temp }}/NinePlusDerivedData
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/mini-ninebot.app"
          INFO_PLIST="$APP_PATH/Info.plist"

          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/NinebotWidgets.appex"
          test -f "$APP_PATH/Assets.car"
          plutil -lint "$INFO_PLIST"

          # The compiled app must expose an AppIcon entry in its generated
          # Info.plist. This catches a missing/invalid AppIcon asset catalog.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$INFO_PLIST" | grep -qx 'AppIcon'
          ICON_INFO="$(xcrun --sdk iphoneos assetutil --info "$APP_PATH/Assets.car")"
          grep -q 'AppIcon' <<< "$ICON_INFO"

      - name: Package IPA
        id: package
        env:
          DERIVED_DATA: ${{ runner.temp }}/NinePlusDerivedData
          ARTIFACT_DIR: ${{ runner.temp }}/NinePlusIPA
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/mini-ninebot.app"
          IPA_PATH="$ARTIFACT_DIR/NinePlus-LiveRide-unsigned.ipa"

          mkdir -p "$ARTIFACT_DIR/Payload"
          ditto "$APP_PATH" "$ARTIFACT_DIR/Payload/mini-ninebot.app"
          (
            cd "$ARTIFACT_DIR"
            /usr/bin/zip -qry "$(basename "$IPA_PATH")" Payload
            rm -rf Payload
          )
          shasum -a 256 "$IPA_PATH" > "$IPA_PATH.sha256"
          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinePlus-LiveRide-unsigned-ipa
          path: |
            ${{ steps.package.outputs.artifact_dir }}/NinePlus-LiveRide-unsigned.ipa
            ${{ steps.package.outputs.artifact_dir }}/NinePlus-LiveRide-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ steps.package.outputs.artifact_dir }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(
            "$ARTIFACT_DIR/NinePlus-LiveRide-unsigned.ipa"
            "$ARTIFACT_DIR/NinePlus-LiveRide-unsigned.ipa.sha256"
          )
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --title "NinePlus LiveRide $TAG_NAME" \
              --generate-notes
          fi
