name: Build and publish IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

# A tag build creates/updates the matching GitHub Release. Branch builds upload
# an Actions artifact, which keeps unsigned development packages short-lived.
permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and package unsigned IPA
        id: package
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/NinePlusIPA
          DERIVED_DATA: ${{ runner.temp }}/NinePlusDerivedData
        run: |
          set -euo pipefail
          IPA_PATH="$(scripts/package-unsigned-ipa.sh \
            --output "$ARTIFACT_DIR" \
            --derived-data "$DERIVED_DATA")"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$IPA_PATH.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinePlus-LiveRide-unsigned-ipa
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=("$IPA_PATH" "$CHECKSUM_PATH")
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --title "NinePlus LiveRide $TAG_NAME" \
              --generate-notes
          fi
