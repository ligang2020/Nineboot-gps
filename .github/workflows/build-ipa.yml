name: Build and publish IPA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Also upload the IPA to a GitHub Release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release_tag:
        description: 'Release tag to create/update when publish_release=true'
        required: false
        default: 'latest-unsigned-ipa'
  push:
    branches: [main, master]
    tags: ['v*']

# Every run uploads an Actions artifact. Tag builds publish the matching GitHub
# Release automatically; manual runs can opt into publishing/updating a release.
permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and package unsigned IPA
        id: package
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/NinePlusIPA
          DERIVED_DATA: ${{ runner.temp }}/NinePlusDerivedData
        run: |
          set -euo pipefail
          IPA_PATH="$(scripts/package-unsigned-ipa.sh \
            --output "$ARTIFACT_DIR" \
            --derived-data "$DERIVED_DATA")"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$IPA_PATH.sha256" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$(basename "$IPA_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ipa_name }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_release }}" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload IPA to GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          files=("$IPA_PATH" "$CHECKSUM_PATH")
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${files[@]}" \
              --title "NinePlus LiveRide $TAG_NAME" \
              --notes "Unsigned IPA built by GitHub Actions from ${GITHUB_SHA}."
          fi
